<svg width="3804" height="1953" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" overflow="hidden"><g transform="translate(-320 -283)"><rect x="323.5" y="1312.5" width="2805" height="409" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#F2F2F2"/><rect x="425.5" y="1374.5" width="562" height="284" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#BFBFBF"/><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 457.547 1535)">flex: </text><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="700" font-size="55" transform="matrix(1 0 0 1 639.734 1535)">0 0 200px</text><rect x="1019.5" y="1374.5" width="1407" height="284" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#BFBFBF"/><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 1052.5 1535)">flex: </text><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="700" font-size="55" transform="matrix(1 0 0 1 1234.68 1535)">1</text><rect x="323.5" y="1823.5" width="2805" height="409" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#F2F2F2"/><rect x="426.5" y="1886.5" width="1255" height="284" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#BFBFBF"/><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 459.25 2047)">flex: </text><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="700" font-size="55" transform="matrix(1 0 0 1 641.438 2047)">50%</text><rect x="323.5" y="286.5" width="2805" height="409" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#F2F2F2"/><rect x="425.5" y="349.5" width="493" height="283" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#BFBFBF"/><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 457.547 509)">flex: </text><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="700" font-size="55" transform="matrix(1 0 0 1 639.735 509)">none</text><rect x="323.5" y="797.5" width="2805" height="410" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#F2F2F2"/><rect x="425.5" y="860.5" width="1017" height="284" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#BFBFBF"/><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 457.547 1021)">flex: </text><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="700" font-size="55" transform="matrix(1 0 0 1 639.734 1021)">0 0 300px</text><rect x="1475.5" y="860.5" width="1547" height="284" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#BFBFBF"/><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 1508.05 1021)">flex: </text><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="700" font-size="55" transform="matrix(1 0 0 1 1690.24 1021)">1</text><rect x="950.5" y="349.5" width="493" height="283" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#BFBFBF"/><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 982.798 509)">flex: </text><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="700" font-size="55" transform="matrix(1 0 0 1 1164.99 509)">none</text><rect x="1475.5" y="349.5" width="493" height="283" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#BFBFBF"/><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 1508.05 509)">flex: </text><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="700" font-size="55" transform="matrix(1 0 0 1 1690.24 509)">none</text><rect x="2459.5" y="1374.5" width="563" height="284" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#BFBFBF"/><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 2491.86 1535)">flex: </text><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="700" font-size="55" transform="matrix(1 0 0 1 2674.05 1535)">0 0 200px</text><rect x="2389.5" y="1886.5" width="635" height="284" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#BFBFBF"/><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 2421.76 2047)">flex: </text><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="700" font-size="55" transform="matrix(1 0 0 1 2603.95 2047)">25%</text><rect x="1717.5" y="1886.5" width="635" height="284" stroke="#000000" stroke-width="6.875" stroke-miterlimit="8" fill="#BFBFBF"/><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 1750.33 2047)">flex: </text><text font-family="Consolas,Consolas_MSFontService,sans-serif" font-weight="700" font-size="55" transform="matrix(1 0 0 1 1932.52 2047)">25%</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3194.78 444)">每個項目會根據它自己的內容自然展</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3194.78 510)">開，不一定會剛好填滿整個容器的寬</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3194.78 576)">度。</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3304.78 576)"> </text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3192.95 890)">第一個項目的寬度是固定</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3797.95 890)"> </text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3810.55 890)">300px</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3961.8 890)">，如</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3192.95 956)">果你擔心內容太多會把它撐得更寬，</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3192.95 1022)">也可以加個最大寬度</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3687.95 1022)"> </text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3700.55 1022)">max</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3809.98 1022)">-</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3828.88 1022)">width </text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3988.73 1022)">來</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3192.95 1088)">限制它。第二個項目會去填滿所有剩</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3192.95 1154)">下的空間</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3412.95 1154)"> </text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3192.95 1470)">第一個和第三</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3522.95 1470)">個項目的寬度都是固定</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3192.95 1536)">的</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3247.95 1536)"> </text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3260.55 1536)">200px</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3411.8 1536)">。中間項目會</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3741.8 1536)">自動擴展，撐</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3192.95 1602)">滿容器裡</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3412.95 1602)">剩下部分</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3632.95 1602)">。</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3687.95 1602)"> </text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3192.95 2015)">讓</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3247.95 2015)">項目的寬度依照設定的百分比來擴</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3192.95 2081)">展，按比例分配空間。</text><text font-family="Noto Sans TC,Noto Sans TC_MSFontService,sans-serif" font-weight="400" font-size="55" transform="matrix(1 0 0 1 3742.95 2081)"> </text></g></svg>